<!DOCTYPE html>
<html>
<head>
  <title>Candy Blast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>🍬 Candy Blast</h1>
  <p>Match candies and score points!</p>

  <button onclick="play()">Start Game</button>

  <h2 id="score">Score: 0</h2>

  <script>
    let score = 0;

    function play(){
      score += 10;
      document.getElementById("score").innerHTML =
      "Score: " + score;
    }
  </script>

</body>
</html>
